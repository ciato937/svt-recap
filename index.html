<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff">
  <title>2026 SEVENTEEN 공연 리캡</title>
  <link rel="stylesheet" href="styles.css?v=6">
  <link rel="stylesheet" href="receipt-enhancements.css?v=1">
  <script src="jp-ticket-options.js?v=1" defer></script>
  <script src="app.js?v=5" defer></script>
  <script src="receipt-modal.js?v=1" defer></script>
  <script src="receipt-enhancements.js?v=1" defer></script>
</head>
<body>
  <header>
    <div class="wrap">
      <small>SEVENTEEN · YEAR IN REVIEW · 2026</small>
      <h1>나의 공연 리캡</h1>
      <p>공연을 기록하고, 티켓 지출을 정리해 보세요.</p>
    </div>
  </header>
  <main class="wrap">
    <div class="columns">
      <section>
        <section class="panel">
          <div class="heading"><h2>국가 / 지역</h2><div><button id="allCountries" type="button">전체 선택</button> <button id="clearCountries" type="button">전체 해제</button></div></div>
          <div id="countries" class="countries"></div>
        </section>
        <section class="panel filter-row">
          <h2>월별 필터</h2>
          <details><summary id="monthSummary">전체 12개월</summary><div id="months" class="menu"></div></details>
        </section>
        <section class="panel filter-row">
          <h2>공연 유형</h2>
          <details><summary id="categorySummary">전체 유형</summary><div id="categories" class="menu"></div></details>
        </section>
        <section class="panel">
          <div class="heading"><h2>공연 목록</h2><div class="event-actions"><button id="selectVisibleEvents" type="button">공연 전체 선택</button><button id="clearVisibleEvents" type="button">전체 해제</button><span id="count"></span></div></div>
          <div id="events" class="events"></div>
        </section>
      </section>
      <aside id="receipt" class="panel receipt" hidden role="dialog" aria-modal="true" aria-labelledby="receiptTitle" tabindex="-1">
        <div class="receipt-topline"><small>CARAT MEMORY · 2026</small><button class="receipt-close" type="button" aria-label="영수증 닫기">×</button></div>
        <div class="receipt-mark" aria-hidden="true">✦</div>
        <p class="receipt-kicker">YOUR CONCERT YEAR</p>
        <h2 id="receiptTitle">공연 영수증</h2>
        <label class="nickname-label">닉네임 (선택)<input id="nickname" maxlength="24" placeholder="닉네임"></label>
        <div class="receipt-total"><span>총 지출 · KRW 환산</span><strong id="total">₩0</strong><small id="visitCount">관람 0회 · 국가 0개</small></div>
        <div class="receipt-divider"><span>✦</span></div>
        <section class="monthly-summary" aria-labelledby="monthlySummaryTitle">
          <h3 id="monthlySummaryTitle">월별 관람 · 지출</h3>
          <div id="monthlySummary"></div>
        </section>
        <h3>함께한 공연</h3>
        <div id="selectedEvents" class="receipt-events"></div>
        <button id="saveReceiptImage" class="receipt-share" type="button">이미지로 저장</button>
        <button id="share" class="receipt-share" type="button">공유 링크 복사</button>
        <p class="receipt-footnote">당신의 2026년을 함께한 순간들</p>
      </aside>
    </div>
  </main>
  <div id="receiptBackdrop" class="receipt-backdrop" hidden></div>
  <div class="sticky">
    <div><small id="stickyCount">선택한 공연 0회</small><strong id="stickyTotal">₩0</strong></div>
    <button id="done" type="button">영수증 보기</button>
  </div>
</body>
</html>
